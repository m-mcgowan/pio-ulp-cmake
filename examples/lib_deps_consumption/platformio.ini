; Test: consume pio-ulp-cmake via lib_deps
; Validates that the plugin can be installed as a PIO library dependency
; and referenced via ${PROJECT_LIBDEPS_DIR}/${PIOENV}/pio-ulp-cmake/scripts/

[env:esp32s3-idf]
platform = espressif32@55.3.36
framework = espidf
board = esp32-s3-devkitc-1

lib_deps =
    file://../../

extra_scripts =
    pre:${PROJECT_LIBDEPS_DIR}/${PIOENV}/pio-ulp-cmake/scripts/pio_ulp_cmake.py

board_build.ulp_projects =
    ulp_main:ulp
