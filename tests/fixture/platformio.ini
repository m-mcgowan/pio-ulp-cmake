; Test fixture — multi-project ULP build with custom libraries
;
; Tests pio_ulp_cmake.py features that ESP-IDF examples don't exercise:
;   - Multiple ULP projects in one firmware
;   - Symbol prefix namespacing (ulp_ vs sensor_)
;   - External library linking (add_library + target_link_libraries)
;   - Subdirectory libraries (add_subdirectory)

[env:esp32s3-idf]
platform = espressif32@55.3.36
board = esp32-s3-devkitc-1
framework = espidf

extra_scripts = pre:../../scripts/pio_ulp_cmake.py

board_build.ulp_projects =
    ulp_main:ulp
    ulp_sensor:ulp_sensor:sensor_
