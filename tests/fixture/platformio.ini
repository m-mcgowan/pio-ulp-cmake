; Test fixture — multi-project ULP build with custom libraries
;
; Tests pio_ulp_cmake.py features that ESP-IDF examples don't exercise:
;   - Multiple ULP projects in one firmware
;   - Symbol prefix namespacing (ulp_ vs sensor_)
;   - External library linking (add_library + target_link_libraries)
;   - Subdirectory libraries (add_subdirectory)
;
; Environments:
;   esp32s3-idf   — build-only (used by test_ulp_cmake.sh and CI)
;   esp32s3-test  — on-device tests via pio-test-runner + doctest

[env]
board = esp32-s3-devkitc-1
extra_scripts = pre:../../scripts/pio_ulp_cmake.py
board_build.ulp_projects =
    ulp_main:ulp
    ulp_sensor:ulp_sensor:sensor_

[env:esp32s3-idf]
platform = espressif32@55.3.36
framework = espidf

; arduino+espidf build-only env, used by Test 8 to regression-check the
; bootloader-link race that surfaced under pioarduino. FREERTOS_HZ=1000
; (required by arduino-esp32) is set in sdkconfig.defaults alongside
; the ULP RISC-V settings.
[env:esp32s3-arduino-idf]
platform = espressif32@55.3.36
framework = arduino, espidf
extra_scripts =
    pre:scripts/disable_idf_component_manager.py
    pre:../../scripts/pio_ulp_cmake.py

[env:esp32s3-test]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.37/platform-espressif32.zip
framework = arduino, espidf
test_framework = custom
test_build_src = no
board_upload.after_reset = watchdog-reset
extra_scripts =
    pre:scripts/disable_idf_component_manager.py
    pre:../../scripts/pio_ulp_cmake.py
board_build.cmake_extra_args =
    -DSDKCONFIG_DEFAULTS="sdkconfig.defaults;sdkconfig.test.defaults"
build_unflags = -fno-exceptions
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DPIO_FRAMEWORK_ESP_IDF_ENABLE_EXCEPTIONS
    -DDOCTEST_CONFIG_SUPER_FAST_ASSERTS
    -DDOCTEST_CONFIG_NO_POSIX_SIGNALS
    -DDOCTEST_THREAD_LOCAL=
lib_deps =
    doctest/doctest@^2.4.11
    https://github.com/m-mcgowan/pio-test-runner.git
