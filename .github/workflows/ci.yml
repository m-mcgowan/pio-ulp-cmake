name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1"  # Weekly Monday 6am UTC

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install lint tools
        run: pip install flake8

      - name: flake8
        run: flake8 scripts/

      - name: ShellCheck
        uses: ludeeus/action-shellcheck@master
        with:
          scandir: scripts tests
          severity: warning

  # Install platform + framework once per version, then cache for downstream jobs
  setup:
    name: "Setup (${{ matrix.platform_label }})"
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      matrix:
        include:
          - platform_version: "pioarduino-55.03.37"
            platform_spec: "https://github.com/pioarduino/platform-espressif32/releases/download/55.03.37/platform-espressif32.zip"
            platform_label: "pioarduino 55.03.37"
          - platform_version: "pioarduino-54.03.21-2"
            platform_spec: "https://github.com/pioarduino/platform-espressif32/releases/download/54.03.21-2/platform-espressif32.zip"
            platform_label: "pioarduino 54.03.21-2"
          - platform_version: "stock-6.13.0"
            platform_spec: "espressif32@6.13.0"
            platform_label: "stock espressif32 6.13.0"
          - platform_version: "stock-6.12.0"
            platform_spec: "espressif32@6.12.0"
            platform_label: "stock espressif32 6.12.0"
          - platform_version: "stock-6.10.0"
            platform_spec: "espressif32@6.10.0"
            platform_label: "stock espressif32 6.10.0"
    env:
      PLATFORMIO_CORE_DIR: /home/runner/pio-${{ matrix.platform_version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache PlatformIO
        id: cache
        uses: actions/cache@v4
        with:
          path: |
            /home/runner/pio-${{ matrix.platform_version }}/packages
            /home/runner/pio-${{ matrix.platform_version }}/platforms
          key: pio-${{ runner.os }}-${{ matrix.platform_version }}

      - name: Install PlatformIO and platform
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          pip install platformio
          sed -i "s|platform = .*|platform = ${{ matrix.platform_spec }}|" \
            tests/fixture/platformio.ini
          cd tests/fixture && pio pkg install

  test-fixture:
    name: "Test fixture (${{ matrix.platform_label }})"
    runs-on: ubuntu-latest
    needs: setup
    continue-on-error: ${{ matrix.experimental || false }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform_version: "pioarduino-55.03.37"
            platform_spec: "https://github.com/pioarduino/platform-espressif32/releases/download/55.03.37/platform-espressif32.zip"
            platform_label: "pioarduino 55.03.37"
            experimental: false
          - platform_version: "pioarduino-54.03.21-2"
            platform_spec: "https://github.com/pioarduino/platform-espressif32/releases/download/54.03.21-2/platform-espressif32.zip"
            platform_label: "pioarduino 54.03.21-2"
            experimental: false
          - platform_version: "stock-6.13.0"
            platform_spec: "espressif32@6.13.0"
            platform_label: "stock espressif32 6.13.0"
            experimental: false
          - platform_version: "stock-6.12.0"
            platform_spec: "espressif32@6.12.0"
            platform_label: "stock espressif32 6.12.0"
            experimental: false
          - platform_version: "stock-6.10.0"
            platform_spec: "espressif32@6.10.0"
            platform_label: "stock espressif32 6.10.0"
            experimental: true
    env:
      PLATFORMIO_CORE_DIR: /home/runner/pio-${{ matrix.platform_version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Restore PlatformIO cache
        uses: actions/cache@v4
        with:
          path: |
            /home/runner/pio-${{ matrix.platform_version }}/packages
            /home/runner/pio-${{ matrix.platform_version }}/platforms
          key: pio-${{ runner.os }}-${{ matrix.platform_version }}

      - name: Install PlatformIO
        run: pip install platformio

      - name: Run integration tests
        run: ./tests/test_ulp_cmake.sh -v -p '${{ matrix.platform_spec }}'

  build-examples:
    name: "Build examples (${{ matrix.platform_label }})"
    runs-on: ubuntu-latest
    needs: setup
    continue-on-error: ${{ matrix.experimental || false }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform_version: "pioarduino-55.03.37"
            platform_spec: "https://github.com/pioarduino/platform-espressif32/releases/download/55.03.37/platform-espressif32.zip"
            platform_label: "pioarduino 55.03.37"
            experimental: false
          - platform_version: "pioarduino-54.03.21-2"
            platform_spec: "https://github.com/pioarduino/platform-espressif32/releases/download/54.03.21-2/platform-espressif32.zip"
            platform_label: "pioarduino 54.03.21-2"
            experimental: false
          - platform_version: "stock-6.13.0"
            platform_spec: "espressif32@6.13.0"
            platform_label: "stock espressif32 6.13.0"
            experimental: false
          - platform_version: "stock-6.12.0"
            platform_spec: "espressif32@6.12.0"
            platform_label: "stock espressif32 6.12.0"
            experimental: false
          - platform_version: "stock-6.10.0"
            platform_spec: "espressif32@6.10.0"
            platform_label: "stock espressif32 6.10.0"
            experimental: true
    env:
      PLATFORMIO_CORE_DIR: /home/runner/pio-${{ matrix.platform_version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Restore PlatformIO cache
        uses: actions/cache@v4
        with:
          path: |
            /home/runner/pio-${{ matrix.platform_version }}/packages
            /home/runner/pio-${{ matrix.platform_version }}/platforms
          key: pio-${{ runner.os }}-${{ matrix.platform_version }}

      - name: Install PlatformIO
        run: pip install platformio

      - name: Sync examples from framework
        run: ./scripts/sync_examples.sh

      - name: Override platform version in examples
        run: |
          for ini in examples/*/platformio.ini; do
            sed -i "s|platform = .*|platform = ${{ matrix.platform_spec }}|" "$ini"
          done

      - name: Build all examples
        run: |
          for dir in examples/*/; do
            example="$(basename "$dir")"
            echo "=== Building: $example ==="
            (cd "$dir" && pio run)
            echo ""
          done

  package:
    name: Package
    runs-on: ubuntu-latest
    needs: [test-fixture, build-examples]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - name: Extract version from CHANGELOG
        id: version
        run: |
          # Get the first version heading (latest release)
          version=$(grep -oP '(?<=## \[)\d+\.\d+\.\d+' CHANGELOG.md | head -1)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Version: $version"

      - name: Create release archive
        run: |
          version="${{ steps.version.outputs.version }}"
          staging="pio-ulp-cmake-${version}"
          mkdir -p "$staging"

          cp scripts/pio_ulp_cmake.py "$staging/"
          cp README.md "$staging/"
          cp LICENSE "$staging/"
          cp CHANGELOG.md "$staging/"

          tar czf "pio-ulp-cmake-${version}.tar.gz" "$staging"

          # Also keep the standalone script as a separate artifact
          cp scripts/pio_ulp_cmake.py "pio_ulp_cmake-${version}.py"

      - name: Upload release archive
        uses: actions/upload-artifact@v4
        with:
          name: release-archive
          path: pio-ulp-cmake-*.tar.gz
          retention-days: 90

      - name: Upload standalone script
        uses: actions/upload-artifact@v4
        with:
          name: release-script
          path: pio_ulp_cmake-*.py
          retention-days: 90
