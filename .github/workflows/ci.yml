name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  PLATFORMIO_PLATFORM_VERSION: "55.3.36"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install lint tools
        run: pip install flake8

      - name: flake8
        run: flake8 scripts/

      - name: ShellCheck
        uses: ludeeus/action-shellcheck@master
        with:
          scandir: scripts tests
          severity: warning

  test-fixture:
    name: Test (multi-project fixture)
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio/packages
            ~/.platformio/platforms
          key: pio-${{ runner.os }}-${{ env.PLATFORMIO_PLATFORM_VERSION }}-fixture
          restore-keys: |
            pio-${{ runner.os }}-${{ env.PLATFORMIO_PLATFORM_VERSION }}-

      - name: Install PlatformIO
        run: |
          pip install platformio
          pio pkg install -g -p "espressif32@${{ env.PLATFORMIO_PLATFORM_VERSION }}"

      - name: Run integration tests
        run: ./tests/test_ulp_cmake.sh -v

  build-examples:
    name: "Build: ${{ matrix.example }}"
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        example:
          - ulp_fsm
          - ulp_riscv_gpio
          - ulp_riscv_i2c
          - lp_core_gpio
          - lp_core_build_system
          - lp_core_interrupt
          - lp_core_uart_print
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio/packages
            ~/.platformio/platforms
          key: pio-${{ runner.os }}-${{ env.PLATFORMIO_PLATFORM_VERSION }}-${{ matrix.example }}
          restore-keys: |
            pio-${{ runner.os }}-${{ env.PLATFORMIO_PLATFORM_VERSION }}-

      - name: Install PlatformIO
        run: |
          pip install platformio
          pio pkg install -g -p "espressif32@${{ env.PLATFORMIO_PLATFORM_VERSION }}"

      - name: Sync example from framework
        run: ./scripts/sync_examples.sh

      - name: Build example
        run: cd examples/${{ matrix.example }} && pio run

  package:
    name: Package
    runs-on: ubuntu-latest
    needs: [test-fixture, build-examples]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - name: Extract version from CHANGELOG
        id: version
        run: |
          # Get the first version heading (latest release)
          version=$(grep -oP '(?<=## \[)\d+\.\d+\.\d+' CHANGELOG.md | head -1)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Version: $version"

      - name: Create release archive
        run: |
          version="${{ steps.version.outputs.version }}"
          staging="pio-ulp-cmake-${version}"
          mkdir -p "$staging"

          cp scripts/pio_ulp_cmake.py "$staging/"
          cp README.md "$staging/"
          cp LICENSE "$staging/"
          cp CHANGELOG.md "$staging/"

          tar czf "pio-ulp-cmake-${version}.tar.gz" "$staging"

          # Also keep the standalone script as a separate artifact
          cp scripts/pio_ulp_cmake.py "pio_ulp_cmake-${version}.py"

      - name: Upload release archive
        uses: actions/upload-artifact@v4
        with:
          name: release-archive
          path: pio-ulp-cmake-*.tar.gz
          retention-days: 90

      - name: Upload standalone script
        uses: actions/upload-artifact@v4
        with:
          name: release-script
          path: pio_ulp_cmake-*.py
          retention-days: 90
