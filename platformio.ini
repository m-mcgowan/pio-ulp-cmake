[env:esp32s3-idf]
platform = espressif32@55.3.36
board = esp32-s3-devkitc-1
framework = espidf

extra_scripts = pre:scripts/pio_ulp_cmake.py

# Explicitly register ULP projects.
# Format: name:dir[:prefix]  (prefix defaults to "ulp_")
board_build.ulp_projects =
    ulp_main:ulp
    ulp_sensor:ulp_sensor:sensor_
